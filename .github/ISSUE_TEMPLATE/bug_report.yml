name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of `@cycjimmy/weixin-share` you are using.
      placeholder: 8.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, WeChat client version, whether the page runs inside the WeChat built-in browser, and how the package is loaded (bundler / `<script>` / CDN).
      placeholder: |
        Browser: Chrome 130
        WeChat client: 8.0.50
        Inside the WeChat built-in browser: yes
        Loaded via: npm + Vite, or <script src="weixin-share.umd.min.js">
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem.
      placeholder: |
        1. Go to '...'
        2. Tap share to '....'
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The `wxShare()` call and the JS-SDK configuration you pass. Never paste a real signature or app secret.
      render: javascript

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The browser console output around the failure, including the JS-SDK debug log when debugging is enabled.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
