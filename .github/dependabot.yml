version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    labels:
      - dependencies
    open-pull-requests-limit: 10
    # typescript, vite and vitest are left ungrouped on purpose: their majors need
    # to be reviewed on their own instead of riding along with an unrelated bump.
    groups:
      lint:
        patterns:
          - eslint
          - '@antfu/*'
      test:
        patterns:
          - jsdom
          - '@vitest/*'
      build:
        patterns:
          - terser
          - trash-cli
          - fs-extra
          - '@types/*'
          - '@cycjimmy/config-lib'
